      - Learning Velocity
      - Pivot Count
    cta: View Iterations

  - id: unit_economics
    name: Unit Economics
    summary: Per-transaction profitability analysis including CAC, LTV, and contribution margins.
    category: financial_backbone
    metrics:
      - CAC (Customer Acquisition Cost)
      - LTV (Lifetime Value)
      - LTV:CAC Ratio
      - Contribution Margin
    cta: Calculate Economics

  - id: north_star
    name: North Star Metric
    summary: GMV (Gross Merchandise Value) as the primary success indicator for marketplace health.
    category: north_star_kpis
    metrics:
