    summary: Milestone-based checkpoints with success criteria for stage progression.
    category: decision_gates
    metrics:
      - Gates Passed
      - Current Stage
      - Next Milestone
    cta: View Timeline

  - id: financial_projections
    name: 18-Month Projections
    summary: Revenue, cost, and profitability forecasts with sensitivity scenarios.
    category: financial_backbone
    metrics:
