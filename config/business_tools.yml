      - Competitive Advantages
      - Market Gap Score
    cta: View Positioning

  - id: supply_first_motion
    name: Supply-First Motion
    summary: Strategic approach prioritizing supplier acquisition and activation before demand scaling.
    category: market_strategy
    metrics:
