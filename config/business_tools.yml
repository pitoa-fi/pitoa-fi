      - Cost Projections
      - Break-even Point
    cta: View Projections

  - id: growth_loops
    name: Growth Loops
    summary: Self-reinforcing cycles that drive organic marketplace expansion.
    category: growth_engines
    metrics:
      - Loop Velocity
      - Activation per Loop
      - Viral Factor
    cta: Explore Loops

  - id: marketplace_density
    name: Marketplace Density
    summary: Geographic concentration analysis for supply and demand optimization.
    category: market_strategy
    metrics:
