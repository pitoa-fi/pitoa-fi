
tools:
  - id: aarrr
    name: AARRR (Pirate Metrics)
    summary: Acquisition, Activation, Retention, Revenue, Referral framework for tracking marketplace growth funnel.
    category: growth_engines
    metrics:
      - Acquisition Rate
      - Activation %
      - Monthly Retention
      - Revenue per User
      - Viral Coefficient
    cta: View Funnel Analysis

  - id: swot
    name: SWOT Analysis
    summary: Strengths, Weaknesses, Opportunities, Threats analysis for marketplace positioning.
    category: market_strategy
    metrics:
      - Competitive Advantages
      - Risk Factors
      - Market Opportunities
    cta: Explore Analysis

  - id: lean_startup
